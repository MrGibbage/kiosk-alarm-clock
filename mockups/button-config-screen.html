<title>Kiosk Alarm Clock — Customize Buttons</title>
<style>
  :root {
    --ground: #14110e;
    --panel: #211b16;
    --panel-2: #2a221c;
    --panel-3: #332a22;
    --ink: #f4e9d8;
    --muted: #93857a;
    --accent: #f2a93b;
    --accent-ink: #1a1209;
    --hinge: #0b0908;
    --shadow: rgba(0, 0, 0, 0.55);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ground: #f3ece1;
      --panel: #e7ddcc;
      --panel-2: #ded2bd;
      --panel-3: #d4c6ac;
      --ink: #2b2420;
      --muted: #8a7b6c;
      --accent: #b5701f;
      --accent-ink: #fdf6ea;
      --hinge: #c9baa4;
      --shadow: rgba(60, 45, 25, 0.18);
    }
  }

  :root[data-theme="light"] {
    --ground: #f3ece1;
    --panel: #e7ddcc;
    --panel-2: #ded2bd;
    --panel-3: #d4c6ac;
    --ink: #2b2420;
    --muted: #8a7b6c;
    --accent: #b5701f;
    --accent-ink: #fdf6ea;
    --hinge: #c9baa4;
    --shadow: rgba(60, 45, 25, 0.18);
  }

  :root[data-theme="dark"] {
    --ground: #14110e;
    --panel: #211b16;
    --panel-2: #2a221c;
    --panel-3: #332a22;
    --ink: #f4e9d8;
    --muted: #93857a;
    --accent: #f2a93b;
    --accent-ink: #1a1209;
    --hinge: #0b0908;
    --shadow: rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    overflow: hidden;
  }

  button { font: inherit; color: inherit; }

  .stage {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    padding: clamp(1rem, 2.5vw, 1.75rem);
  }

  .app-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding-bottom: clamp(0.5rem, 1.5vw, 1rem);
    flex: none;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 999px;
    border: none;
    background: var(--panel);
    cursor: pointer;
    flex: none;
  }

  .icon-btn svg { width: 1.2rem; height: 1.2rem; }

  .app-bar h1 {
    flex: 1;
    margin: 0;
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    font-size: clamp(1.3rem, 2.4vw, 1.7rem);
    font-weight: 400;
  }

  .hint {
    margin: 0 0 clamp(1.25rem, 4vh, 2.5rem);
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }

  /* ---------- preview button bar (mirrors the real main-screen grid) ---------- */

  .preview-wrap {
    flex: none;
    max-width: 54rem;
    width: 100%;
    margin: 0 auto;
  }

  .preview-label {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-bottom: 0.75rem;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: clamp(0.5rem, 1.4vw, 1rem);
    width: 100%;
  }

  .config-tile {
    position: relative;
    touch-action: none;
  }

  .config-tile.is-dragging { z-index: 5; }
  .config-tile.is-dragging .tile {
    opacity: 0.55;
    box-shadow: 0 10px 24px var(--shadow);
    transform: scale(1.04);
  }

  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    padding: clamp(0.7rem, 2vw, 1.1rem) 0.4rem;
    border: none;
    border-radius: 0.6rem;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 1px 0 var(--shadow) inset, 0 3px 8px var(--shadow);
    transition: transform 120ms ease, background 120ms ease;
  }

  .tile:active { transform: translateY(2px) scale(0.98); background: var(--panel-2); }

  .tile svg {
    width: clamp(1.3rem, 3.4vw, 1.9rem);
    height: clamp(1.3rem, 3.4vw, 1.9rem);
    color: var(--accent);
  }

  .tile span {
    font-size: clamp(0.62rem, 1.3vw, 0.8rem);
    letter-spacing: 0.02em;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .grip {
    position: absolute;
    top: -0.5rem;
    right: -0.5rem;
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 999px;
    border: 2px solid var(--ground);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px var(--shadow);
    touch-action: none;
  }

  .grip:active { cursor: grabbing; }
  .grip svg { width: 0.95rem; height: 0.95rem; }

  .badge-ha {
    position: absolute;
    bottom: -0.4rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.55rem;
    letter-spacing: 0.05em;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    background: var(--panel-3);
    color: var(--muted);
    white-space: nowrap;
  }

  /* ---------- action-type legend ---------- */

  .legend {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: clamp(1.5rem, 5vh, 3rem);
    font-size: 0.78rem;
    color: var(--muted);
  }

  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .legend-dot { width: 0.55rem; height: 0.55rem; border-radius: 999px; flex: none; }
  .legend-dot.app { background: var(--accent); }
  .legend-dot.ha { background: var(--panel-3); border: 1px solid var(--muted); }

  /* ---------- dialogs ---------- */

  .backdrop {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--hinge) 55%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease;
    z-index: 10;
  }

  .backdrop.is-open { opacity: 1; pointer-events: auto; }

  .dialog {
    width: min(26rem, 92vw);
    max-height: 90vh;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 1rem;
    padding: clamp(1.1rem, 2vw, 1.6rem);
    box-shadow: 0 20px 50px var(--shadow);
    transform: scale(0.94) translateY(10px);
    opacity: 0;
    transition: transform 160ms ease, opacity 160ms ease;
  }

  .backdrop.is-open .dialog { transform: scale(1) translateY(0); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .backdrop, .dialog, .config-tile.is-dragging .tile { transition: none; }
  }

  .dialog h2 {
    margin: 0 0 clamp(1rem, 2.4vw, 1.5rem);
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    font-size: clamp(1.2rem, 2.2vw, 1.4rem);
    font-weight: 400;
    text-align: center;
  }

  .field { margin-bottom: clamp(0.9rem, 2vw, 1.25rem); }

  .field-label {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .label-input {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border-radius: 0.5rem;
    border: 1px solid var(--panel-3);
    background: var(--panel-2);
    color: var(--ink);
    font-size: 0.95rem;
    font-family: inherit;
  }

  /* icon grid */

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 0.5rem;
    max-height: 11.5rem;
    overflow-y: auto;
    padding: 0.15rem;
  }

  .icon-swatch {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1;
    border-radius: 0.5rem;
    border: 1px solid var(--panel-3);
    background: var(--panel-2);
    color: var(--ink);
    cursor: pointer;
  }

  .icon-swatch svg { width: 1.15rem; height: 1.15rem; }

  .icon-swatch.is-selected {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  /* segmented action-type toggle */

  .segmented {
    display: flex;
    border-radius: 0.5rem;
    overflow: hidden;
    border: 1px solid var(--panel-3);
  }

  .segmented button {
    flex: 1;
    padding: 0.55rem;
    border: none;
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
  }

  .segmented button.is-active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* option lists (app actions + HA search results) */

  .option-list {
    max-height: 12rem;
    overflow-y: auto;
    border-radius: 0.5rem;
    background: var(--panel-2);
  }

  .option-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    padding: 0.6rem 0.8rem;
    border: none;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }

  .option-row:hover { background: var(--panel-3); }
  .option-row.is-selected { color: var(--accent); }
  .option-row svg { width: 1rem; height: 1rem; flex: none; color: var(--muted); }
  .option-row.is-selected svg { color: var(--accent); }

  .option-text { flex: 1; min-width: 0; }
  .option-name { font-size: 0.88rem; display: block; }
  .option-sub {
    font-size: 0.72rem;
    color: var(--muted);
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .option-check { width: 1rem; height: 1rem; flex: none; color: var(--accent); visibility: hidden; }
  .option-row.is-selected .option-check { visibility: visible; }

  .selected-summary {
    font-size: 0.78rem;
    color: var(--muted);
    margin: 0.5rem 0 0;
  }
  .selected-summary strong { color: var(--ink); font-weight: 500; }

  .sheet-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
    margin-top: clamp(1rem, 2.4vw, 1.5rem);
  }

  .btn {
    padding: 0.6rem 1.1rem;
    border-radius: 0.5rem;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .btn--ghost { background: transparent; color: var(--muted); }
  .btn--primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .icon-btn:focus-visible,
  .grip:focus-visible,
  .tile:focus-visible,
  .icon-swatch:focus-visible,
  .segmented button:focus-visible,
  .option-row:focus-visible,
  .btn:focus-visible,
  .label-input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>

<div class="stage">
  <div class="app-bar">
    <button class="icon-btn" type="button" id="backBtn" aria-label="Back to clock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"></path></svg>
    </button>
    <h1>Customize Buttons</h1>
  </div>

  <p class="hint">Drag the grip on a tile to reorder it. Tap a tile to change its icon, label, or action.</p>

  <div class="preview-wrap">
    <p class="preview-label">Main Screen Preview</p>
    <nav class="buttons" id="buttonBar"></nav>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot app"></span> Alarm Clock action</span>
      <span class="legend-item"><span class="legend-dot ha"></span> Home Assistant action</span>
    </div>
  </div>
</div>

<div class="backdrop" id="configBackdrop">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Edit button">
    <h2>Edit Button</h2>

    <div class="field">
      <span class="field-label">Icon</span>
      <div class="icon-grid" id="iconGrid"></div>
    </div>

    <div class="field">
      <label class="field-label" for="labelInput">Label</label>
      <input class="label-input" id="labelInput" type="text" maxlength="14" />
    </div>

    <div class="field">
      <span class="field-label">Action Type</span>
      <div class="segmented" id="actionTypeToggle">
        <button type="button" data-type="app">Alarm Clock</button>
        <button type="button" data-type="ha">Home Assistant</button>
      </div>
    </div>

    <div class="field" id="appActionField">
      <span class="field-label">Alarm Clock Action</span>
      <div class="option-list" id="appActionList"></div>
    </div>

    <div class="field" id="haActionField" hidden>
      <span class="field-label">Home Assistant Action</span>
      <input class="label-input" id="haSearch" type="text" placeholder="Search lights, fans, scripts, scenes…" style="margin-bottom: 0.5rem;" />
      <div class="option-list" id="haActionList"></div>
    </div>

    <p class="selected-summary" id="selectedSummary"></p>

    <div class="sheet-actions">
      <button class="btn btn--ghost" id="cancelConfigBtn" type="button">Cancel</button>
      <button class="btn btn--primary" id="saveConfigBtn" type="button">Save</button>
    </div>
  </div>
</div>

<script>
  (function () {
    "use strict";

    var SVGNS = "http://www.w3.org/2000/svg";

    // Icon library — same hand-drawn line-icon style as the rest of the
    // app (viewBox 0 0 24, stroke currentColor). A handful are reused
    // verbatim from index.html/lighting.html/alarms.html for visual
    // continuity; the rest are new but drawn to match.

      lighting: '<circle cx="12" cy="12" r="1.6"></circle><path d="M12 12c0-4 2-7 5-7 1 2 0 5-5 7Z"></path><path d="M12 12c-4 1-7-1-7-4 2-2 5-1 7 4Z"></path><path d="M12 12c1 4-1 7-4 7-2-1-1-5 4-7Z"></path>',
      bulb: '<path d="M8 5h8"></path><path d="M9 5c0 3 1.5 4.5 3 4.5S15 8 15 5"></path><path d="M9.5 12.5 8 16M12 12.5v4M14.5 12.5 16 16"></path>',
      lamp: '<path d="M7 4h10l-3 6h3l-7 9 1.5-6.5H8L7 4Z"></path>',
      fan: '<circle cx="12" cy="12" r="1.5"></circle><path d="M12 12 12 4Q17 4 16.5 9Q16 12.5 12 12"></path><path d="M12 12 4.8 8.7Q3 12.7 7.3 14.8Q11 16.3 12 12"></path><path d="M12 12 17.8 18Q21 14.5 17.8 11.2Q14.5 9.3 12 12"></path>',
      moon: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"></path>',
      bathroom: '<path d="M4 12h15a1 1 0 0 1 1 1 5 5 0 0 1-5 5H8a5 5 0 0 1-5-5v-1Z"></path><path d="M6 12V7a2 2 0 0 1 3-1.7"></path><path d="M4 20v-1M18 20v-1"></path>',
      skip: '<path d="M12 5a6 6 0 0 0-6 6c0 3.2-1 4.5-2 5.5h11"></path><path d="M17 8a6 6 0 0 1 1 3c0 3.2 1 4.5 2 5.5h-3M4 4l16 16"></path>',
      alarm: '<path d="M12 5a6 6 0 0 0-6 6c0 3.2-1 4.5-2 5.5h16c-1-1-2-2.3-2-5.5a6 6 0 0 0-6-6Z"></path><path d="M10.3 19.5a2 2 0 0 0 3.4 0"></path>',

      tv: '<rect x="3" y="5" width="18" height="12" rx="1.5"></rect><path d="M9 20h6M12 17v3"></path>',
      speaker: '<path d="M9 18V6l10-2v12"></path><circle cx="7" cy="18" r="2.2"></circle><circle cx="17" cy="16" r="2.2"></circle>',
      coffee: '<path d="M5 9h12v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9Z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M8 4c0 1-1 1-1 2M12 4c0 1-1 1-1 2"></path>',
      blinds: '<rect x="4" y="4" width="16" height="16" rx="1"></rect><path d="M4 8h16M4 12h16M4 16h16"></path>',
      camera: '<rect x="3" y="7" width="18" height="13" rx="2"></rect><circle cx="12" cy="13.5" r="3.5"></circle><path d="M8 7l1.5-3h5L16 7"></path>',
      plug: '<path d="M9 3v6M15 3v6"></path><path d="M6 9h12v3a6 6 0 0 1-12 0V9Z"></path><path d="M12 18v3"></path>',
      droplet: '<path d="M12 3c4 5 7 8.5 7 12a7 7 0 0 1-14 0c0-3.5 3-7 7-12Z"></path>',
      sun: '<circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"></path>',

    function iconSvg(id, cls) {
      var inner = ICONS[id] || ICONS.star;
      return '<svg class="' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + inner + "</svg>";

    // Alarm-clock-specific actions — things that only make sense inside
    // this app (navigate a screen, or poke the app's own HA helpers),
    // as opposed to a general HA entity/service call.
    var APP_ACTIONS = [
      { id: "open_lighting", name: "Open Lighting Screen", icon: "lighting" },
      { id: "open_alarms", name: "Open Alarms Screen", icon: "alarm" },
      { id: "skip_tonight", name: "Skip Tonight", icon: "skip" },
      { id: "snooze", name: "Snooze Active Alarm", icon: "alarm" }
    ];

    // Stand-in for "the entire list of HA actions" the real Settings
    // screen would fetch live — enough variety to demo filtering, in the
    // spirit of the Android HA widget's entity picker.
    var HA_ACTIONS = [
      { id: "light.master_bedroom_fan_light", name: "Ceiling Light", sub: "light.master_bedroom_fan_light", icon: "bulb" },
      { id: "light.master_bedroom_skip_nightstand", name: "Skip's Nightstand", sub: "light.master_bedroom_skip_nightstand", icon: "lamp" },
      { id: "light.master_bedroom_suzanne_nightstand", name: "Suzanne's Nightstand", sub: "light.master_bedroom_suzanne_nightstand", icon: "lamp" },
      { id: "light.master_bath_vanity", name: "Bathroom Vanity", sub: "light.master_bath_vanity", icon: "bathroom" },
      { id: "light.kitchen_master", name: "Kitchen Master", sub: "light.kitchen_master", icon: "bulb" },
      { id: "fan.ceiling_fan", name: "Ceiling Fan", sub: "fan.ceiling_fan", icon: "fan" },
      { id: "script.bedtime", name: "Good Night (script)", sub: "script.bedtime", icon: "moon" },
      { id: "scene.master_bedroom_off", name: "Bedroom Off (scene)", sub: "scene.master_bedroom_off", icon: "moon" },
      { id: "scene.master_bedroom_all_on", name: "Bedroom All On (scene)", sub: "scene.master_bedroom_all_on", icon: "bulb" },
      { id: "switch.garage_lights", name: "Garage Lights", sub: "switch.garage_lights", icon: "garage" },
      { id: "climate.bedroom_thermostat", name: "Bedroom Thermostat", sub: "climate.bedroom_thermostat", icon: "thermostat" },
      { id: "lock.front_door", name: "Front Door Lock", sub: "lock.front_door", icon: "lock" },
      { id: "cover.bedroom_blinds", name: "Bedroom Blinds", sub: "cover.bedroom_blinds", icon: "blinds" },
      { id: "media_player.bedroom_speaker", name: "Bedroom Speaker", sub: "media_player.bedroom_speaker", icon: "speaker" },
      { id: "camera.front_porch", name: "Front Porch Camera", sub: "camera.front_porch", icon: "camera" },
      { id: "switch.coffee_maker", name: "Coffee Maker", sub: "switch.coffee_maker", icon: "coffee" }
    ];

    function findApp(id) { return APP_ACTIONS.filter(function (a) { return a.id === id; })[0]; }
    function findHa(id) { return HA_ACTIONS.filter(function (a) { return a.id === id; })[0]; }

    // Starting state mirrors the real app's current 6 tiles, so this
    // preview feels grounded rather than arbitrary.
    var uidCounter = 1;
    var slots = [
      { uid: uidCounter++, icon: "lighting", label: "Lighting", type: "app", action: "open_lighting" },
      { uid: uidCounter++, icon: "bulb", label: "Ceiling Light", type: "ha", action: "light.master_bedroom_fan_light" },
      { uid: uidCounter++, icon: "moon", label: "Good Night", type: "ha", action: "script.bedtime" },
      { uid: uidCounter++, icon: "bathroom", label: "Bathroom", type: "ha", action: "light.master_bath_vanity" },
      { uid: uidCounter++, icon: "skip", label: "Skip Tonight", type: "app", action: "skip_tonight" },
      { uid: uidCounter++, icon: "alarm", label: "Snooze", type: "app", action: "snooze" }
    ];

    var buttonBar = document.getElementById("buttonBar");

    function tileMarkup(slot) {
      return (
        '<button class="grip" type="button" aria-label="Drag to reorder">' +
          '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.4"></circle><circle cx="16" cy="6" r="1.4"></circle><circle cx="8" cy="12" r="1.4"></circle><circle cx="16" cy="12" r="1.4"></circle><circle cx="8" cy="18" r="1.4"></circle><circle cx="16" cy="18" r="1.4"></circle></svg>' +
        "</button>" +
        '<button class="tile" type="button">' +
          iconSvg(slot.icon) +
          "<span>" + slot.label + "</span>" +
        "</button>" +
        '<span class="badge-ha">' + (slot.type === "app" ? "Alarm Clock" : "Home Assistant") + "</span>"
      );
    }

    function renderTile(slot) {
      var el = document.createElement("div");
      el.className = "config-tile";
      el.dataset.uid = slot.uid;
      el.innerHTML = tileMarkup(slot);
      el.querySelector(".tile").addEventListener("click", function () { openConfig(slot.uid); });
      wireDrag(el);
      return el;
    }

    function renderAll() {
      buttonBar.innerHTML = "";
      slots.forEach(function (slot) { buttonBar.appendChild(renderTile(slot)); });
    }

    function updateTileContent(uid) {
      var slot = slots.filter(function (s) { return s.uid === uid; })[0];
      var el = buttonBar.querySelector('.config-tile[data-uid="' + uid + '"]');
      if (!slot || !el) return;
      el.innerHTML = tileMarkup(slot);
      el.querySelector(".tile").addEventListener("click", function () { openConfig(slot.uid); });
      wireDrag(el);
    }

    /* ---------- drag to reorder ---------- */
    /* Moves the actual DOM node (rather than re-rendering) so a pointer
       capture started on the grip survives the reorder; state.slots is
       resynced from final DOM order on release. */

    function wireDrag(tileEl) {
      var grip = tileEl.querySelector(".grip");
      var dragging = false;

      grip.addEventListener("pointerdown", function (evt) {
        dragging = true;
        tileEl.classList.add("is-dragging");
        grip.setPointerCapture(evt.pointerId);
      });

      grip.addEventListener("pointermove", function (evt) {
        if (!dragging) return;
        var siblings = Array.prototype.slice.call(buttonBar.children).filter(function (c) { return c !== tileEl; });
        var x = evt.clientX;
        for (var i = 0; i < siblings.length; i++) {
          var rect = siblings[i].getBoundingClientRect();
          var mid = rect.left + rect.width / 2;
          if (x < mid) {
            buttonBar.insertBefore(tileEl, siblings[i]);
            return;
          }
        }
        buttonBar.appendChild(tileEl);
      });

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        tileEl.classList.remove("is-dragging");
        // Resync state.slots to match the final DOM order.
        var order = Array.prototype.slice.call(buttonBar.children).map(function (c) { return parseInt(c.dataset.uid, 10); });
        slots.sort(function (a, b) { return order.indexOf(a.uid) - order.indexOf(b.uid); });
      }

      grip.addEventListener("pointerup", endDrag);
      grip.addEventListener("pointercancel", endDrag);
    }

    /* ---------- config dialog ---------- */

    var backdrop = document.getElementById("configBackdrop");
    var iconGrid = document.getElementById("iconGrid");
    var labelInput = document.getElementById("labelInput");
    var actionTypeToggle = document.getElementById("actionTypeToggle");
    var appActionField = document.getElementById("appActionField");
    var haActionField = document.getElementById("haActionField");
    var appActionList = document.getElementById("appActionList");
    var haActionList = document.getElementById("haActionList");
    var haSearch = document.getElementById("haSearch");
    var selectedSummary = document.getElementById("selectedSummary");

    var editing = null; // { uid, icon, label, type, action } — draft copy

    Object.keys(ICONS).forEach(function (id) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "icon-swatch";
      btn.dataset.icon = id;
      btn.innerHTML = iconSvg(id);
      btn.addEventListener("click", function () {
        editing.icon = id;
        renderIconGrid();
        updateSummary();
      });
      iconGrid.appendChild(btn);
    });

    function renderIconGrid() {
      Array.prototype.slice.call(iconGrid.children).forEach(function (btn) {
        btn.classList.toggle("is-selected", btn.dataset.icon === editing.icon);
      });
    }

    function renderAppActionList() {
      appActionList.innerHTML = "";
      APP_ACTIONS.forEach(function (a) {
        var row = document.createElement("button");
        row.type = "button";
        row.className = "option-row" + (editing.type === "app" && editing.action === a.id ? " is-selected" : "");
        row.innerHTML =
          iconSvg(a.icon) +
          '<span class="option-text"><span class="option-name">' + a.name + "</span></span>" +
          '<svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg>';
        row.addEventListener("click", function () {
          editing.type = "app";
          editing.action = a.id;
          renderAppActionList();
          updateSummary();
        });
        appActionList.appendChild(row);
      });
    }

    function renderHaActionList() {
      var q = haSearch.value.trim().toLowerCase();
      haActionList.innerHTML = "";
      HA_ACTIONS.filter(function (a) {
        return !q || a.name.toLowerCase().indexOf(q) !== -1 || a.sub.toLowerCase().indexOf(q) !== -1;
      }).forEach(function (a) {
        var row = document.createElement("button");
        row.type = "button";
        row.className = "option-row" + (editing.type === "ha" && editing.action === a.id ? " is-selected" : "");
        row.innerHTML =
          iconSvg(a.icon) +
          '<span class="option-text"><span class="option-name">' + a.name + '</span><span class="option-sub">' + a.sub + "</span></span>" +
          '<svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg>';
        row.addEventListener("click", function () {
          editing.type = "ha";
          editing.action = a.id;
          renderHaActionList();
          updateSummary();
        });
        haActionList.appendChild(row);
      });
    }

    haSearch.addEventListener("input", renderHaActionList);

    Array.prototype.slice.call(actionTypeToggle.querySelectorAll("button")).forEach(function (btn) {
      btn.addEventListener("click", function () {
        setActionType(btn.dataset.type);
      });
    });

    function setActionType(type) {
      appActionField.hidden = type !== "app";
      haActionField.hidden = type !== "ha";
      Array.prototype.slice.call(actionTypeToggle.querySelectorAll("button")).forEach(function (btn) {
        btn.classList.toggle("is-active", btn.dataset.type === type);
      });
    }

    function updateSummary() {
      var name = editing.type === "app" ? (findApp(editing.action) || {}).name : (findHa(editing.action) || {}).name;
      selectedSummary.innerHTML = "Selected action: <strong>" + (name || "none") + "</strong>";
    }

    function openConfig(uid) {
      var slot = slots.filter(function (s) { return s.uid === uid; })[0];
      if (!slot) return;
      editing = { uid: slot.uid, icon: slot.icon, label: slot.label, type: slot.type, action: slot.action };

      labelInput.value = editing.label;
      renderIconGrid();
      setActionType(editing.type);
      haSearch.value = "";
      renderAppActionList();
      renderHaActionList();
      updateSummary();

      backdrop.classList.add("is-open");
    }

    function closeConfig() {
      backdrop.classList.remove("is-open");
      editing = null;
    }

    document.getElementById("cancelConfigBtn").addEventListener("click", closeConfig);
    backdrop.addEventListener("click", function (evt) { if (evt.target === backdrop) closeConfig(); });

    document.getElementById("saveConfigBtn").addEventListener("click", function () {
      if (!editing) return;
      var slot = slots.filter(function (s) { return s.uid === editing.uid; })[0];
      if (!slot) return;
      slot.icon = editing.icon;
      slot.label = labelInput.value.trim() || "Button";
      slot.type = editing.type;
      slot.action = editing.action;
      updateTileContent(slot.uid);
      closeConfig();
    });

    document.getElementById("backBtn").addEventListener("click", function () {
      // In the real app this would just navigate back to index.html.
      backBtn_noop();
    });
    function backBtn_noop() { /* mockup — no real navigation target */ }

    renderAll();
  })();
</script>
