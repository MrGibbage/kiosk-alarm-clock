services:
  kiosk-alarm-clock:
    image: caddy:2-alpine
    container_name: kiosk-alarm-clock
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 50

    ports:
      - "8850:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./app:/srv/app:ro
      - ./media:/srv/app/media:ro
