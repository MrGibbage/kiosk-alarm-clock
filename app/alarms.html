<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kiosk Alarm Clock — Alarms</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  .stage {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    padding: clamp(1rem, 2.5vw, 1.75rem);
  }

  .app-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding-bottom: clamp(0.75rem, 2vw, 1.25rem);
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 999px;
    border: none;
    background: var(--panel);
    cursor: pointer;
    flex: none;
  }

  .icon-btn svg { width: 1.2rem; height: 1.2rem; }

  .app-bar h1 {
    flex: 1;
    margin: 0;
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    font-size: clamp(1.3rem, 2.4vw, 1.7rem);
    font-weight: 400;
  }

  .add-btn { color: var(--accent); }

  .alarm-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    max-width: 44rem;
    width: 100%;
    margin: 0 auto;
    overflow-y: auto;
    padding-bottom: 1rem;
  }

  .alarm-row {
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    align-items: center;
    gap: clamp(0.75rem, 2vw, 1.5rem);
    padding: 1rem 1.1rem;
    border-radius: 0.75rem;
    background: var(--panel);
    border: none;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 1px 0 var(--shadow) inset, 0 2px 8px var(--shadow);
  }

  .alarm-row[data-enabled="false"] .time,
  .alarm-row[data-enabled="false"] .label {
    color: var(--muted);
  }

  .alarm-row[data-enabled="false"] .day-chip.is-active {
    background: var(--panel-3);
    color: var(--muted);
  }

  .switch {
    position: relative;
    width: 2.6rem;
    height: 1.5rem;
    border-radius: 999px;
    border: none;
    background: var(--panel-3);
    cursor: pointer;
    flex: none;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 0.18rem;
    left: 0.18rem;
    width: 1.14rem;
    height: 1.14rem;
    border-radius: 999px;
    background: var(--muted);
    transition: transform 140ms ease, background 140ms ease;
  }

  .switch[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 35%, var(--panel-3)); }
  .switch[aria-checked="true"]::after {
    transform: translateX(1.1rem);
    background: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    .switch::after { transition: none; }
  }

  .time-label {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    min-width: 6.5rem;
  }

  .time {
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    font-size: clamp(1.4rem, 2.6vw, 1.85rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .label {
    font-size: clamp(0.75rem, 1.3vw, 0.88rem);
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  .day-chips {
    display: flex;
    gap: 0.3rem;
  }

  .day-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: clamp(1.5rem, 2.4vw, 1.75rem);
    height: clamp(1.5rem, 2.4vw, 1.75rem);
    border-radius: 999px;
    font-size: clamp(0.65rem, 1.1vw, 0.75rem);
    color: var(--muted);
    background: transparent;
    border: none;
  }

  .day-chip.is-active {
    background: color-mix(in srgb, var(--accent) 24%, transparent);
    color: var(--accent);
  }

  .chevron { color: var(--muted); flex: none; }
  .chevron svg { width: 1rem; height: 1rem; }

  .add-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.9rem;
    border-radius: 0.75rem;
    border: 1.5px dashed var(--panel-3);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }

  .add-row svg { width: 1rem; height: 1rem; }

  .icon-btn:focus-visible,
  .switch:focus-visible,
  .alarm-row:focus-visible,
  .add-row:focus-visible,
  .day-chip:focus-visible,
  .ampm-btn:focus-visible,
  .btn:focus-visible,
  .time-segment:focus-visible,
  .sound-trigger:focus-visible,
  .sound-option:focus-visible,
  .sound-preview:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .sound-trigger {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    padding: 0.65rem 0.8rem;
    border-radius: 0.5rem;
    border: 1px solid var(--panel-3);
    background: var(--panel-2);
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }

  .sound-trigger svg { width: 1rem; height: 1rem; flex: none; color: var(--accent); }
  .sound-trigger-name { flex: 1; font-size: 0.95rem; }
  .sound-trigger-chevron { color: var(--muted) !important; transition: transform 140ms ease; }
  .sound-trigger[aria-expanded="true"] .sound-trigger-chevron { transform: rotate(180deg); }

  @media (prefers-reduced-motion: reduce) {
    .sound-trigger-chevron { transition: none; }
  }

  .sound-list {
    margin-top: 0.4rem;
    border-radius: 0.5rem;
    background: var(--panel-2);
    overflow: hidden;
  }

  .sound-list[hidden] { display: none; }

  .sound-option {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.6rem 0.8rem;
    cursor: pointer;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    color: var(--ink);
  }

  .sound-option:hover { background: var(--panel-3); }
  .sound-option.is-selected { color: var(--accent); }
  .sound-option .sound-type-icon { width: 0.95rem; height: 0.95rem; flex: none; color: var(--muted); }
  .sound-option.is-selected .sound-type-icon { color: var(--accent); }
  .sound-option-name { flex: 1; font-size: 0.88rem; }

  .sound-preview {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.8rem;
    height: 1.8rem;
    border-radius: 999px;
    border: none;
    background: var(--panel-3);
    color: var(--accent);
    flex: none;
    cursor: pointer;
  }

  .sound-preview svg { width: 0.8rem; height: 0.8rem; }

  .backdrop {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--hinge) 55%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease;
    z-index: 10;
  }

  .backdrop.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .dialog {
    width: min(26rem, 92vw);
    max-height: 92vh;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 1rem;
    padding: clamp(1.1rem, 2vw, 1.6rem);
    box-shadow: 0 20px 50px var(--shadow);
    transform: scale(0.94) translateY(10px);
    opacity: 0;
    transition: transform 160ms ease, opacity 160ms ease;
  }

  .backdrop.is-open .dialog {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    .backdrop, .dialog { transition: none; }
  }

  .picker-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: clamp(1rem, 2.4vw, 1.5rem);
  }

  .time-segment {
    border: none;
    background: transparent;
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    font-size: clamp(2.4rem, 6vw, 3.1rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--muted);
    padding: 0.1rem 0.4rem;
    border-radius: 0.5rem;
    cursor: pointer;
  }

  .time-segment.is-active {
    color: var(--accent-ink);
    background: var(--accent);
  }

  .time-colon {
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    font-size: clamp(2.4rem, 6vw, 3.1rem);
    color: var(--muted);
  }

  .ampm-toggle {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    margin-left: 0.5rem;
  }

  .ampm-btn {
    border: 1px solid var(--panel-3);
    background: transparent;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    padding: 0.3rem 0.6rem;
    border-radius: 0.4rem;
    cursor: pointer;
  }

  .ampm-btn.is-active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .dial-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: clamp(1rem, 2.4vw, 1.5rem);
  }

  .dial {
    width: 15.5rem;
    height: 15.5rem;
    touch-action: none;
    user-select: none;
  }

  .dial-face { fill: var(--panel-2); }
  .dial-center { fill: var(--accent); }
  .dial-hand { stroke: var(--accent); stroke-width: 2; }
  .dial-hand-end { fill: var(--accent); opacity: 0.28; }

  .dial-number {
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    text-anchor: middle;
    dominant-baseline: central;
    fill: var(--ink);
    pointer-events: none;
  }

  .dial-number-bg { fill: transparent; }
  .dial-number-bg.is-selected { fill: var(--accent); }
  .dial-number.is-selected { fill: var(--accent-ink); }

  .field { margin-bottom: clamp(0.9rem, 2vw, 1.25rem); }

  .field-label {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .day-row {
    display: flex;
    justify-content: space-between;
    gap: 0.3rem;
  }

  .day-row .day-chip {
    width: 2.2rem;
    height: 2.2rem;
    background: var(--panel-2);
    font-size: 0.8rem;
  }

  .day-row .day-chip.is-active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .label-input {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border-radius: 0.5rem;
    border: 1px solid var(--panel-3);
    background: var(--panel-2);
    color: var(--ink);
    font-size: 0.95rem;
  }

  .sheet-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.5rem;
  }

  .sheet-actions-spacer { flex: 1; }

  .btn {
    padding: 0.6rem 1.1rem;
    border-radius: 0.5rem;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .btn--ghost { background: transparent; color: var(--muted); }
  .btn--danger { background: transparent; color: #e0685a; }
  .btn--primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
</style>
</head>
<body>

<div class="stage">
  <div class="app-bar">
    <button class="icon-btn" type="button" id="backBtn" aria-label="Back to clock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"></path></svg>
    </button>
    <h1>Alarms</h1>
    <button class="icon-btn add-btn" id="addAlarmBtn" type="button" aria-label="Add alarm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>

  <div class="alarm-list" id="alarmList">
    <button class="add-row" id="addAlarmRow" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      <span>Add alarm</span>
    </button>
  </div>
</div>

<div class="backdrop" id="backdrop">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Edit alarm">
    <div class="picker-header">
      <button class="time-segment is-active" id="hourSegment" type="button">06</button>
      <span class="time-colon">:</span>
      <button class="time-segment" id="minuteSegment" type="button">30</button>
      <div class="ampm-toggle">
        <button class="ampm-btn" data-ampm="AM" type="button">AM</button>
        <button class="ampm-btn" data-ampm="PM" type="button">PM</button>
      </div>
    </div>

    <div class="dial-wrap">
      <svg class="dial" id="dial" viewBox="0 0 240 240"></svg>
    </div>

    <div class="field">
      <span class="field-label">Repeat</span>
      <div class="day-row" id="dayRow">
        <button class="day-chip" type="button" data-day="0">S</button>
        <button class="day-chip" type="button" data-day="1">M</button>
        <button class="day-chip" type="button" data-day="2">T</button>
        <button class="day-chip" type="button" data-day="3">W</button>
        <button class="day-chip" type="button" data-day="4">T</button>
        <button class="day-chip" type="button" data-day="5">F</button>
        <button class="day-chip" type="button" data-day="6">S</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Sound</span>
      <button class="sound-trigger" id="soundTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span id="soundTriggerIcon"></span>
        <span class="sound-trigger-name" id="soundTriggerName">Chimes</span>
        <svg class="sound-trigger-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <div class="sound-list" id="soundList" role="listbox" hidden></div>
    </div>

    <div class="field">
      <label class="field-label" for="labelInput">Label</label>
      <input class="label-input" id="labelInput" type="text" value="Weekday" />
    </div>

    <div class="sheet-actions">
      <button class="btn btn--danger" id="deleteBtn" type="button" hidden>Delete</button>
      <span class="sheet-actions-spacer"></span>
      <button class="btn btn--ghost" id="cancelBtn" type="button">Cancel</button>
      <button class="btn btn--primary" id="saveBtn" type="button">Save</button>
    </div>
  </div>
</div>

<script src="js/config-store.js"></script>
<script src="js/ha-client.js"></script>
<script src="js/alarms.js"></script>
</body>
</html>
