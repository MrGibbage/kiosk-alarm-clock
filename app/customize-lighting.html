<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kiosk Alarm Clock — Customize Lighting Cards</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  .stage {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    padding: clamp(1rem, 2.5vw, 1.75rem);
  }

  .app-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding-bottom: clamp(0.5rem, 1.5vw, 1rem);
    flex: none;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 999px;
    border: none;
    background: var(--panel);
    cursor: pointer;
    flex: none;
  }

  .icon-btn svg { width: 1.2rem; height: 1.2rem; }

  .app-bar h1 {
    flex: 1;
    margin: 0;
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    font-size: clamp(1.3rem, 2.4vw, 1.7rem);
    font-weight: 400;
  }

  .hint {
    margin: 0 0 clamp(1rem, 3vh, 1.75rem);
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }

  .layout-wrap {
    flex: none;
    max-width: 54rem;
    width: 100%;
    margin: 0 auto clamp(1.25rem, 3.5vh, 2rem);
  }

  .layout-label {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-bottom: 0.6rem;
  }

  .segmented {
    display: flex;
    border-radius: 0.5rem;
    overflow: hidden;
    border: 1px solid var(--panel-3);
    max-width: 24rem;
    margin: 0 auto;
  }

  .segmented button {
    flex: 1;
    padding: 0.55rem;
    border: none;
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
  }

  .segmented button.is-active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .preview-wrap {
    flex: none;
    max-width: 54rem;
    width: 100%;
    margin: 0 auto;
  }

  .preview-label {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-bottom: 0.75rem;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
    grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr));
    gap: clamp(0.6rem, 1.6vw, 1.1rem);
    width: 100%;
  }

  .config-card { position: relative; touch-action: none; }
  .config-card.is-dragging { z-index: 5; }
  .config-card.is-dragging .card-tile {
    opacity: 0.55;
    box-shadow: 0 10px 24px var(--shadow);
    transform: scale(1.04);
  }

  .card-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    min-height: 6rem;
    padding: clamp(0.9rem, 2.2vw, 1.4rem) 0.6rem;
    border: none;
    border-radius: 0.75rem;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 1px 0 var(--shadow) inset, 0 3px 8px var(--shadow);
    transition: transform 120ms ease, background 120ms ease;
  }

  .card-tile:active { transform: translateY(2px) scale(0.98); background: var(--panel-2); }

  .card-tile svg {
    width: clamp(1.5rem, 3.6vw, 2.1rem);
    height: clamp(1.5rem, 3.6vw, 2.1rem);
    color: var(--accent);
  }

  .card-tile span {
    font-size: clamp(0.72rem, 1.5vw, 0.9rem);
    letter-spacing: 0.02em;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .grip {
    position: absolute;
    top: -0.65rem;
    right: -0.65rem;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 999px;
    border: 2px solid var(--ground);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px var(--shadow);
    touch-action: none;
  }

  .grip:active { cursor: grabbing; }
  .grip svg { width: 1.2rem; height: 1.2rem; }

  .badge-entity {
    position: absolute;
    bottom: -0.4rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.55rem;
    letter-spacing: 0.02em;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    background: var(--panel-3);
    color: var(--muted);
    white-space: nowrap;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .save-status {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 1rem;
    min-height: 1.1em;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--hinge) 55%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease;
    z-index: 10;
  }

  .backdrop.is-open { opacity: 1; pointer-events: auto; }

  .dialog {
    width: min(46rem, 94vw);
    max-height: 92vh;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 1rem;
    padding: clamp(1.1rem, 2vw, 1.6rem);
    box-shadow: 0 20px 50px var(--shadow);
    transform: scale(0.94) translateY(10px);
    opacity: 0;
    transition: transform 160ms ease, opacity 160ms ease;
  }

  .dialog-body {
    display: flex;
    gap: clamp(1rem, 2.5vw, 1.5rem);
    align-items: stretch;
  }

  .dialog-col-icon {
    flex: 0 0 13rem;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .dialog-col-icon .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-bottom: 0;
  }

  .dialog-col-fields { flex: 1; min-width: 0; }

  @media (max-width: 34rem) {
    .dialog-body { flex-direction: column; }
    .dialog-col-icon { flex: none; width: 100%; max-height: 15rem; }
  }

  .backdrop.is-open .dialog { transform: scale(1) translateY(0); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .backdrop, .dialog, .config-card.is-dragging .card-tile { transition: none; }
  }

  .dialog h2 {
    margin: 0 0 clamp(1rem, 2.4vw, 1.5rem);
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    font-size: clamp(1.2rem, 2.2vw, 1.4rem);
    font-weight: 400;
    text-align: center;
  }

  .field { margin-bottom: clamp(0.9rem, 2vw, 1.25rem); }

  .field-label {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .label-input {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border-radius: 0.5rem;
    border: 1px solid var(--panel-3);
    background: var(--panel-2);
    color: var(--ink);
    font-size: 0.95rem;
    font-family: inherit;
  }

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    align-content: start;
    gap: 0.5rem;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0.15rem;
  }

  .icon-swatch {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1;
    border-radius: 0.5rem;
    border: 1px solid var(--panel-3);
    background: var(--panel-2);
    color: var(--ink);
    cursor: pointer;
  }

  .icon-swatch svg { width: 1.15rem; height: 1.15rem; }

  .icon-swatch.is-selected {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .entity-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .entity-header .label-input { flex: 1; margin-bottom: 0.5rem; }

  .clear-entity-btn {
    flex: none;
    padding: 0.6rem 0.8rem;
    border-radius: 0.5rem;
    border: 1px solid var(--panel-3);
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.82rem;
    margin-bottom: 0.5rem;
  }

  .option-list {
    max-height: 12rem;
    overflow-y: auto;
    border-radius: 0.5rem;
    background: var(--panel-2);
  }

  .option-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    padding: 0.6rem 0.8rem;
    border: none;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }

  .option-row:hover { background: var(--panel-3); }
  .option-row.is-selected { color: var(--accent); }
  .option-row svg { width: 1rem; height: 1rem; flex: none; color: var(--muted); }
  .option-row.is-selected svg { color: var(--accent); }

  .option-text { flex: 1; min-width: 0; }
  .option-name { font-size: 0.88rem; display: block; }
  .option-sub {
    font-size: 0.72rem;
    color: var(--muted);
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .option-check { width: 1rem; height: 1rem; flex: none; color: var(--accent); visibility: hidden; }
  .option-row.is-selected .option-check { visibility: visible; }
  .option-empty { padding: 0.8rem; font-size: 0.82rem; color: var(--muted); text-align: center; }

  .selected-summary { font-size: 0.78rem; color: var(--muted); margin: 0.5rem 0 0; }
  .selected-summary strong { color: var(--ink); font-weight: 500; }

  .sheet-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
    margin-top: clamp(1rem, 2.4vw, 1.5rem);
  }

  .btn {
    padding: 0.6rem 1.1rem;
    border-radius: 0.5rem;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .btn--ghost { background: transparent; color: var(--muted); }
  .btn--primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .icon-btn:focus-visible,
  .grip:focus-visible,
  .card-tile:focus-visible,
  .icon-swatch:focus-visible,
  .segmented button:focus-visible,
  .option-row:focus-visible,
  .btn:focus-visible,
  .clear-entity-btn:focus-visible,
  .label-input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="app-bar">
    <button class="icon-btn" type="button" id="backBtn" aria-label="Back to settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"></path></svg>
    </button>
    <h1>Customize Lighting Cards</h1>
  </div>

  <p class="hint">Drag the grip on a card to reorder it. Tap a card to change its icon, label, or entity.</p>

  <div class="layout-wrap">
    <p class="layout-label">Layout</p>
    <div class="segmented" id="layoutToggle">
      <button type="button" data-layout="1x3">1 × 3</button>
      <button type="button" data-layout="2x2">2 × 2</button>
      <button type="button" data-layout="2x3">2 × 3</button>
    </div>
  </div>

  <div class="preview-wrap">
    <p class="preview-label">Lighting Screen Preview</p>
    <div class="cards" id="cardBar"></div>
    <p class="save-status" id="saveStatus"></p>
  </div>
</div>

<div class="backdrop" id="configBackdrop">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Edit lighting card">
    <h2>Edit Card</h2>

    <div class="dialog-body">
      <div class="dialog-col-icon">
        <div class="field">
          <span class="field-label">Icon</span>
          <div class="icon-grid" id="iconGrid"></div>
        </div>
      </div>

      <div class="dialog-col-fields">
        <div class="field">
          <label class="field-label" for="labelInput">Label</label>
          <input class="label-input" id="labelInput" type="text" maxlength="14" />
        </div>

        <div class="field">
          <span class="field-label">Entity</span>
          <div class="entity-header">
            <input class="label-input" id="entitySearch" type="text" placeholder="Search lights, fans, switches…" />
            <button class="clear-entity-btn" type="button" id="clearEntityBtn">Clear</button>
          </div>
          <div class="option-list" id="entityList"></div>
        </div>

        <p class="selected-summary" id="selectedSummary"></p>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn--ghost" id="cancelConfigBtn" type="button">Cancel</button>
      <button class="btn btn--primary" id="saveConfigBtn" type="button">Save</button>
    </div>
  </div>
</div>

<script src="js/config-store.js"></script>
<script src="js/icons.js"></script>
<script src="js/ha-client.js"></script>
<script src="js/customize-lighting.js"></script>
</body>
</html>
