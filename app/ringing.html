<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kiosk Alarm Clock — Ringing</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(ellipse 80% 60% at 50% 30%, var(--panel-2) 0%, var(--ground) 75%);
  }

  .ringing-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .scrim {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--ground) 55%, transparent);
    z-index: 1;
  }

  .ringing-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 3vh, 2rem);
    padding: 2rem;
    text-align: center;
  }

  .ringing-icon {
    width: clamp(3.5rem, 10vw, 5.5rem);
    height: clamp(3.5rem, 10vw, 5.5rem);
    color: var(--accent);
    animation: ring-shake 1.4s ease-in-out infinite;
  }

  @keyframes ring-shake {
    0%, 100% { transform: rotate(0deg); }
    10% { transform: rotate(-12deg); }
    20% { transform: rotate(10deg); }
    30% { transform: rotate(-8deg); }
    40% { transform: rotate(6deg); }
    50%, 100% { transform: rotate(0deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ringing-icon { animation: none; }
  }

  .ringing-label {
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: var(--ink);
  }

  .ringing-time {
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(3rem, 10vw, 5.5rem);
    color: var(--ink);
    line-height: 1;
  }

  .ringing-actions {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: min(22rem, 80vw);
    margin-top: clamp(1rem, 3vh, 2rem);
  }

  .btn {
    padding: 1.1rem;
    border-radius: 0.75rem;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .btn--primary { background: var(--accent); color: var(--accent-ink); }
  .btn--ghost { background: var(--panel); color: var(--ink); }

  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>

<div class="stage">
  <video class="ringing-video" id="ringingVideo" hidden muted playsinline loop></video>
  <div class="scrim"></div>

  <div class="ringing-content">
    <svg class="ringing-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a6 6 0 0 0-6 6c0 3.2-1 4.5-2 5.5h16c-1-1-2-2.3-2-5.5a6 6 0 0 0-6-6Z"></path><path d="M10.3 19.5a2 2 0 0 0 3.4 0"></path></svg>
    <div class="ringing-label" id="ringingLabel">Alarm</div>
    <div class="ringing-time" id="ringingTime">--:--</div>

    <div class="ringing-actions">
      <button class="btn btn--primary" id="snoozeBtn" type="button">Snooze</button>
      <button class="btn btn--ghost" id="dismissBtn" type="button">Dismiss</button>
    </div>
  </div>
</div>

<audio id="ringingAudio" hidden loop></audio>

<script src="js/config-store.js"></script>
<script src="js/ha-client.js"></script>
<script src="js/ringing.js"></script>
</body>
</html>
